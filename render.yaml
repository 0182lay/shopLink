services:
  - type: web
    name: shoplink-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DEFAULT_WHATSAPP_PHONE
        sync: false
      - key: DEFAULT_MESSENGER_URL
        sync: false
